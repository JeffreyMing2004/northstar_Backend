spring.application.name=northstar_backend
# 生产必须显式设置 SPRING_PROFILES_ACTIVE=prod（见 docs/SECURITY-REMEDIATION-20260929.md）。
# 这里的 local 兜底只服务于本机开发：SecurityStartupValidator 会在「local + 远程库 + 自动改表」
# 这一危险组合下直接拒绝启动，避免生产忘记设 profile 时静默沿用开发配置。
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Local secrets from .env (gitignored); real env vars take precedence
spring.config.import=optional:file:.env[.properties]

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/web?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:web}
spring.datasource.password=${DB_PASSWORD}

# JPA
# 生产（prod profile）必须为 validate：禁止 Hibernate 在生产自动改表（NS-12）。
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000ms
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT
# 无默认值：缺失或过弱会导致启动失败（NS-01）。生成：openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Administration
admin.usernames=${ADMIN_USERNAMES:}

# Minecraft server bridge
# 无默认值：不再提供 local-bridge-secret 之类的兜底（NS-05）。
northstar.bridge.secret=${NORTHSTAR_BRIDGE_SECRET}
northstar.bridge.stats-max-age-seconds=${BRIDGE_STATS_MAX_AGE_SECONDS:90}
# 允许上报的来源 IP，逗号分隔，支持单个 IP 与 IPv4 CIDR；留空表示不限制来源。
northstar.bridge.allowed-ips=${BRIDGE_ALLOWED_IPS:}

# Minecraft client verification (GET /api/beta/verify)
# qq 合法格式，与客户端 Mod 的 qqPattern 保持一致
northstar.verify.qq-pattern=${VERIFY_QQ_PATTERN:^[1-9]\\d{4,10}$}
# 每个来源 IP 每分钟允许的校验次数，<=0 表示不限流
northstar.verify.rate-limit-per-minute=${VERIFY_RATE_LIMIT_PER_MINUTE:60}
# 是否强制要求白名单条目已绑定游戏ID（mcId）。
# true（默认，严格）：未绑定游戏ID 的条目一律判为「未通过」——否则任意游戏ID 都能
#       借用该 QQ 的资格进入服务器（NS-04）。
# false：未绑定游戏ID 的 QQ 用任意游戏ID 都能通过。仅在过渡期临时使用。
northstar.verify.require-mc-id=${VERIFY_REQUIRE_MC_ID:true}

# SMTP Email (NetEase)
spring.mail.host=${MAIL_HOST:smtp.yeah.net}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:northstar2026@yeah.net}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=465

# Server
server.port=${SERVER_PORT:8080}

# 反向代理转发头（OpenResty / Nginx）。
# 生产环境前端静态站与 /api 都挂在 OpenResty 后面，必须让 Spring 采信 X-Forwarded-*，
# 否则 request.getRemoteAddr() 恒为 127.0.0.1，X-Forwarded-Proto 也会被忽略。
# 反代侧务必用 $remote_addr 「覆盖」 X-Forwarded-For（而不是 $proxy_add_x_forwarded_for），
# 这样该头只会有一项，取值不存在歧义，客户端也无法伪造来源。
# 若端口直接对外暴露、不经过任何反代，设为 none。
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# CORS
# 默认只允许正式域名；localhost 只写在（不随构建产物分发的）开发 profile 里（NS-07）。
app.cors.allowed-origins=${CORS_ORIGINS:https://northstar.mingpixel.net}

# ---------------------------------------------------------------------------
# 安全基线（见 docs/SECURITY-REMEDIATION-20260929.md）
# ---------------------------------------------------------------------------

# 传输层安全响应头（NS-06）。静态前端由 OpenResty 直出，那里也要单独配置一套。
northstar.security.headers.enabled=${SECURITY_HEADERS_ENABLED:true}
northstar.security.hsts-max-age-seconds=${HSTS_MAX_AGE_SECONDS:2592000}
northstar.security.hsts-include-subdomains=${HSTS_INCLUDE_SUBDOMAINS:true}
northstar.security.content-security-policy=${SECURITY_CSP:default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'}
# 由后端强制 http -> https 跳转（Cloudflare 已开 Always Use HTTPS 时可保持 false）
northstar.security.force-https=${FORCE_HTTPS:false}
# 开发 profile 兜底防护：开启时，「local profile + 远程数据库 + ddl-auto=update」会拒绝启动
northstar.security.strict-dev-profile=${SECURITY_STRICT_DEV_PROFILE:true}
# 本机开发确实要连远程库时，在 application-local.properties 里显式置 true
northstar.security.allow-dev-profile-on-remote-db=${SECURITY_ALLOW_REMOTE_DB_IN_DEV:false}

# 认证接口限流与验证码策略（NS-03 / NS-08 / NS-10）
northstar.auth.password-min-length=${AUTH_PASSWORD_MIN_LENGTH:8}
northstar.auth.code-ttl-seconds=${AUTH_CODE_TTL_SECONDS:120}
northstar.auth.code-max-attempts=${AUTH_CODE_MAX_ATTEMPTS:5}
northstar.auth.revocation-retention-seconds=${AUTH_REVOCATION_RETENTION_SECONDS:2592000}
northstar.auth.login-ip-limit=${AUTH_LOGIN_IP_LIMIT:30}
northstar.auth.login-ip-window-seconds=${AUTH_LOGIN_IP_WINDOW_SECONDS:300}
northstar.auth.login-account-fail-limit=${AUTH_LOGIN_ACCOUNT_FAIL_LIMIT:10}
northstar.auth.login-account-window-seconds=${AUTH_LOGIN_ACCOUNT_WINDOW_SECONDS:900}
northstar.auth.login-delay-enabled=${AUTH_LOGIN_DELAY_ENABLED:true}
northstar.auth.login-delay-max-ms=${AUTH_LOGIN_DELAY_MAX_MS:1000}
northstar.auth.send-code-ip-limit=${AUTH_SEND_CODE_IP_LIMIT:5}
northstar.auth.send-code-ip-window-seconds=${AUTH_SEND_CODE_IP_WINDOW_SECONDS:600}
northstar.auth.forgot-lookup-ip-limit=${AUTH_FORGOT_LOOKUP_IP_LIMIT:10}
northstar.auth.forgot-lookup-ip-window-seconds=${AUTH_FORGOT_LOOKUP_IP_WINDOW_SECONDS:600}
northstar.auth.reset-ip-limit=${AUTH_RESET_IP_LIMIT:10}
northstar.auth.reset-ip-window-seconds=${AUTH_RESET_IP_WINDOW_SECONDS:600}

# 公开查询接口限流 / 去自增化（NS-11 / NS-14）
northstar.public.beta-check-limit-per-minute=${PUBLIC_BETA_CHECK_LIMIT_PER_MINUTE:30}
northstar.public.avatar-limit-per-minute=${PUBLIC_AVATAR_LIMIT_PER_MINUTE:60}
northstar.public.numeric-id-lookup-enabled=${PUBLIC_NUMERIC_ID_LOOKUP:false}
