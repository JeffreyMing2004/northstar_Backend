# ===========================================================================
# 生产 profile
#
# 激活方式：SPRING_PROFILES_ACTIVE=prod（systemd Environment / .env 均可）。
# 未激活时应用会落到 local 兜底，而 SecurityStartupValidator 会在
# 「local + 远程数据库 + ddl-auto=update」时直接拒绝启动。
#
# 本文件不含任何真实口令：所有密钥仍必须由环境变量注入（NS-01 / NS-02）。
# ===========================================================================

# --- 数据库 --------------------------------------------------------------
# 生产不再用 Hibernate 自动改表（NS-12）。首次以 validate 启动前，
# 请确认现网库结构已由既有的 ddl-auto=update 建成；若 validate 报字段不匹配，
# 先用 DDL_AUTO=none 临时放行并在维护窗口内对齐 schema。
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
# 数据层迁入内网后（推荐）把地址改为内网 IP；启用 TLS 时改 sslMode=REQUIRED。
spring.datasource.url=${DB_URL:jdbc:mysql://43.136.177.54:3306/web?serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}

# --- Redis ---------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:43.136.177.54}
spring.data.redis.port=${REDIS_PORT:6379}

# --- 跨域：生产只允许正式域名（NS-07）--------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:https://northstar.mingpixel.net}

# --- 传输层（NS-06）------------------------------------------------------
# Cloudflare 已开 Always Use HTTPS 时保持 false；若要让源站自己兜底可置 true。
northstar.security.force-https=${FORCE_HTTPS:false}

# --- 内测校验（NS-04）----------------------------------------------------
# 生产必须严格：白名单条目没绑定游戏 ID 一律不放行。
northstar.verify.require-mc-id=${VERIFY_REQUIRE_MC_ID:true}
