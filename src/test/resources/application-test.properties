spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.data.redis.host=localhost
spring.data.redis.port=6379
jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=86400000

# SecurityStartupValidator 要求桥接令牌必须显式配置（不再有 local-bridge-secret 默认值）
northstar.bridge.secret=test-bridge-secret-0123456789abcdef

# 关掉校验接口的按 IP 限流：@SpringBootTest 的上下文在多个测试类之间共享，
# 限流计数器会跨类累计，导致 HTTP 用例随机变 429。限流逻辑本身由
# BetaWhitelistServiceTest 与 RateLimitServiceTest 直接构造实例覆盖。
northstar.verify.rate-limit-per-minute=0

# 同理：认证与公开接口的限流在测试里一律放宽，避免跨测试类累计触发 429。
# 阈值行为由 AuthGuardTest / RateLimitServiceTest 用构造实例覆盖。
northstar.auth.login-ip-limit=100000
northstar.auth.login-account-fail-limit=100000
northstar.auth.login-delay-enabled=false
northstar.auth.send-code-ip-limit=100000
northstar.auth.forgot-lookup-ip-limit=100000
northstar.auth.reset-ip-limit=100000
northstar.public.beta-check-limit-per-minute=0
northstar.public.avatar-limit-per-minute=0

# 内测校验必须显式声明策略：生产默认是 true（未绑定游戏ID 一律拒绝），
# 而这里的用例需要覆盖「未绑定游戏ID 的宽松分支」，因此显式设为 false。
# 严格分支由 BetaWhitelistServiceTest#rejectsUnboundEntryWhenStrictMode 覆盖。
northstar.verify.require-mc-id=false
