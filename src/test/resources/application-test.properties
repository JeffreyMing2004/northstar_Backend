spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.data.redis.host=localhost
spring.data.redis.port=6379
jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm
jwt.expiration=86400000

# 关掉校验接口的按 IP 限流：@SpringBootTest 的上下文在多个测试类之间共享，
# 限流计数器会跨类累计，导致 HTTP 用例随机变 429。限流逻辑本身由
# BetaWhitelistServiceTest#rateLimitsPerIp 直接构造实例覆盖。
northstar.verify.rate-limit-per-minute=0