plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ming'
version = '0.0.1-SNAPSHOT'
description = 'northstar_backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 本地开发配置绝不进构建产物。
//
// .gitignore 只能保证它不被提交，挡不住 Gradle 的 processResources 把
// src/main/resources 下的一切照抄进 jar：一旦按本机配置打出的包被直接部署，
// 生产就会「带着开发默认值」运行——数据库地址、口令、JWT 密钥全部来自开发文件，
// 这正是渗透报告 NS-01 / NS-02 的事故形状。
//
// 只排除打包，不影响本机 IDE / bootRun 的 classpath（本地仍然读得到该文件）。
tasks.named('bootJar') {
    exclude '**/application-local.properties'
    exclude '**/*-local.properties'
    exclude '**/.env'
}

tasks.named('jar') {
    exclude '**/application-local.properties'
    exclude '**/*-local.properties'
    exclude '**/.env'
}

tasks.named('test') {
    useJUnitPlatform()
}
